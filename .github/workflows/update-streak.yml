name: Daily Streak Fetch

on:
  schedule:
    # Runs at 12:10 AM IST (18:40 UTC previous day)
    - cron: "40 18 * * *"
  workflow_dispatch:

jobs:
  fetch-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Restore cached streak data
        id: cache-streak
        uses: actions/cache@v3
        with:
          path: streak-data.json
          key: streak-data-${{ github.run_id }}
          restore-keys: |
            streak-data-

      - name: Fetch streak data if cache is empty
        if: steps.cache-streak.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — fetching new streak data..."
          curl -s https://streak-proxy.vercel.app/api/streak > streak-data.json
          echo "Data saved to streak-data.json"
      
      - name: Use cached streak data if available
        if: steps.cache-streak.outputs.cache-hit == 'true'
        run: |
          echo "Cache hit — using existing streak-data.json"
          cat streak-data.json
